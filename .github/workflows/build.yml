name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            python3-pip \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev \
            gettext autopoint

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install "Cython<3"
          python -m pip install buildozer

      - name: Prepare Buildozer Android SDK
        run: |
          buildozer -v android debug 2>&1 | tee build.log &
          BUILDOZER_PID=$!

          for i in {1..120}; do
            if find "$HOME/.buildozer/android/platform" -name sdkmanager -type f 2>/dev/null | grep -q sdkmanager; then
              break
            fi
            sleep 5
          done

          SDKMANAGER=$(find "$HOME/.buildozer/android/platform" -name sdkmanager -type f 2>/dev/null | head -n 1)

          if [ -n "$SDKMANAGER" ]; then
            SDK_ROOT=$(dirname "$(dirname "$(dirname "$SDKMANAGER")")")
            yes | "$SDKMANAGER" --licenses || true
            "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          fi

          wait $BUILDOZER_PID

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MeriApp-APK
          path: bin/*.apk
